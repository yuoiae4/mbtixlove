function emptyMbti(){ return {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}; }
function computeType(s){ return (s.E>=s.I?"E":"I")+(s.S>=s.N?"S":"N")+(s.T>=s.F?"T":"F")+(s.J>=s.P?"J":"P"); }
function emptyPrefs(){ return {close:3,space:3,plan:3,flow:3,talk:3,play:3,words:3,touch:3,future:3,now:3}; }
function applyPref(prefs, val){
  const next = {...prefs};
  const map = {
    closeHi:{close:5,space:2}, closeLo:{close:2,space:5},
    talkHi:{talk:5,play:3}, talkLo:{talk:2,touch:4},
    planHi:{plan:5,flow:2}, planLo:{plan:2,flow:5},
    wordsHi:{words:5,touch:2}, wordsLo:{words:2,touch:5},
    futureHi:{future:5,now:2}, futureLo:{future:2,now:5},
    playHi:{play:5,talk:3}, playLo:{play:2,talk:4},
    spaceHi:{space:5,close:2}, spaceLo:{space:2,close:5},
    touchHi:{touch:5,words:2}, touchLo:{touch:2,words:5},
  };
  Object.assign(next, map[val]||{});
  return next;
}
function affinity(item, type){ return (item.boost && item.boost[type] != null) ? item.boost[type] : 56; }
function prefScore(item, prefs){
  let s=0,w=0;
  PREF_KEYS.forEach((k)=>{ s += 5-Math.abs((item.stats[k]||3)-(prefs[k]||3)); w += 5; });
  return (s/w)*100;
}
function matchScore(item, type, prefs){ return Math.round(affinity(item,type)*0.4 + prefScore(item,prefs)*0.6); }
const DATE_META = {
  nightwalk:{time:"1h",budget:"low",place:"out",stages:["crush","new","long"]},

};
function encodePrefs(p){ return PREF_KEYS.map((k)=>String(Math.max(1,Math.min(5,Math.round((p&&p[k])||3))))).join(""); }
function decodePrefs(str){
  const p = emptyPrefs();
  if (!str) return p;
  PREF_KEYS.forEach((k,i)=>{ const n=parseInt(str[i],10); if(n>=1&&n<=5) p[k]=n; });
  return p;
}
function blendPrefs(a,b){
  const p = emptyPrefs();
  PREF_KEYS.forEach((k)=>{ p[k] = Math.round((((a&&a[k])||3)+((b&&b[k])||3))/2); });
  return p;
}
function quizList(mode){
  if (mode==="short"||mode==="partner") return QUESTIONS.filter((q)=>q.kind==="pref");
  if (mode==="typeonly") return QUESTIONS.filter((q)=>q.kind==="mbti");
  return QUESTIONS;
}
function rankedDates(type, prefs, opts){
  opts = opts || {};
  const rows = DATES.map((d)=>{
    const meta = DATE_META[d.id] || {time:"half",budget:"low",place:"in",stages:["crush","new","long"]};
    let score = matchScore(d, type, prefs);
    if (opts.stage && meta.stages && meta.stages.indexOf(opts.stage)<0) score = Math.round(score*0.78);
    return {item:d, score, meta};
  }).filter((row)=>{
    if (opts.time && opts.time!=="any" && row.meta.time!==opts.time) return false;
    if (opts.budget && opts.budget!=="any" && row.meta.budget!==opts.budget) return false;
    if (opts.place && opts.place!=="any" && row.meta.place!==opts.place) return false;
    return true;
  }).sort((a,b)=>b.score-a.score);
  if (rows.length) return rows;
  return DATES.map((d)=>({item:d, score:matchScore(d,type,prefs), meta:DATE_META[d.id]||{}})).sort((a,b)=>b.score-a.score);
}
function dateReason(item, prefs, lang){
  const hits = PREF_KEYS.map((k)=>({k,g:item.stats[k]||3,p:prefs[k]||3}))
    .filter((x)=>x.g>=4 && x.p>=4).sort((a,b)=>(b.g+b.p)-(a.g+a.p));
  const labels = hits.slice(0,2).map((x)=>PREF_LABEL[lang][x.k]);
  const why = item.why[lang];
  if (!labels.length) return why;
  if (lang==="ja") return why + "。今のあなたは「" + labels.join("・") + "」が強い。";
  if (lang==="zh") return why + "。你现在偏「" + labels.join(" / ") + "」。";
  if (lang==="ko") return why + ". 지금은 「" + labels.join(" / ") + "」 쪽이 강해.";
  if (lang==="es") return why + ". Ahora tiras a 「" + labels.join(" / ") + "」.";
  return why + " You are leaning " + labels.join(" / ") + ".";
}
function likesHates(prefs, lang){
  const pairs = [
    ["close","space", PREF_LABEL[lang].close, PREF_LABEL[lang].space],
    ["plan","flow", PREF_LABEL[lang].plan, PREF_LABEL[lang].flow],
    ["talk","play", PREF_LABEL[lang].talk, PREF_LABEL[lang].play],
    ["words","touch", PREF_LABEL[lang].words, PREF_LABEL[lang].touch],
    ["future","now", PREF_LABEL[lang].future, PREF_LABEL[lang].now],
  ];
  const like=[], hate=[], used=new Set();
  pairs.forEach(([a,b,la,lb])=>{
    const va=prefs[a]||3, vb=prefs[b]||3;
    if (va-vb>=1 && va>=4){ like.push(la); used.add(la); if (vb<=2){ hate.push(lb); used.add(lb);} }
    else if (vb-va>=1 && vb>=4){ like.push(lb); used.add(lb); if (va<=2){ hate.push(la); used.add(la);} }
  });
  return {like:like.slice(0,3), hate:hate.slice(0,3)};
}
function pairScore(a,b){
  if (!a||!b) return 50;
  let n = 52;
  if ((COMPAT[a]||[]).includes(b)) n += 18;
  if (a[0]!==b[0]) n += 6;
  if (a[2]!==b[2]) n += 4;
  if (a[3]===b[3]) n += 4;
  return Math.min(96, n);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const chars = String(text||"").split("");
  let line = "", cy = y, lines = 0;
  for (let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, cy);
      line = chars[i]; cy += lineHeight; lines++;
      if (maxLines && lines>=maxLines){ return cy; }
    } else line = test;
  }
  if (line) ctx.fillText(line, x, cy);
  return cy + lineHeight;
}

function track(name, params){
  try { if (typeof window.gtag === "function") window.gtag("event", name, params||{}); } catch(e){}
}

              {ALL_TYPES.map((code)=>{
                const c = TEMP[temperamentOf(code)];
                return <button key={code} onClick={()=>{ setResultType(code); setScreen("type"); }} className="display" style={{...s.chip, color:c.accent, borderColor:c.accent+"55"}}>{code}</button>;
              })}
            </div>
            <h2 className="display" style={s.h2}>{t.faqTitle}</h2>
            {FAQS.map((f,i)=>(
              <details key={i} style={s.faq}>
                <summary style={s.faqQ}>{f.q[lang]}</summary>
                <p style={s.muted}>{f.a[lang]}</p>
              </details>
            ))}
          </section>
        )}

        {screen==="quiz" && q && (
          <div style={{paddingTop:28}}>
            <p style={s.muted}>{t.questionOf(qIndex+1, questions.length)} · {q.kind==="mbti"?"MBTI":lang==="ja"?"恋愛":lang==="ko"?"연애":lang==="zh"?"恋爱":lang==="es"?"citas":"LOVE"}</p>
            <div style={s.bar}><div style={{...s.barIn, width:`${(qIndex/questions.length)*100}%`}} /></div>
            <h2 className="display" style={s.q}>{q.text[lang]}</h2>
            <div style={{display:"flex", flexDirection:"column", gap:10}}>
              <button style={s.opt} onClick={()=>answer(q.aVal)}>{q.a[lang]}</button>
              <button style={s.opt} onClick={()=>answer(q.bVal)}>{q.b[lang]}</button>
            </div>
            {qIndex>0 && <button style={s.linkBtn} onClick={()=>setQIndex(qIndex-1)}>{t.back}</button>}
          </div>
        )}

        {screen==="invite" && hostInvite && (
          <div style={{paddingTop:24}}>
            <p className="display" style={s.kicker}>{t.hostSaid}</p>
            <h1 className="display" style={s.title}>
              {DATES.find((d)=>d.id===hostInvite.date) ? DATES.find((d)=>d.id===hostInvite.date).name[lang] : (hostInvite.type || t.pairTitle)}
            </h1>
            {hostInvite.type && TYPES[hostInvite.type] && <p style={s.lead}>{TYPES[hostInvite.type].love[lang]}</p>}
            <p style={s.muted}>{t.inviteHint}</p>
            <button style={s.primary} onClick={()=>{ setQuizMode("partner"); setPrefs(emptyPrefs()); setQIndex(0); setScreen("quiz"); }}>{t.partnerStart}</button>
          </div>
        )}

        {screen==="result" && tonight && (
          <div style={{paddingTop:20}}>
            <p className="display" style={s.kicker}>{pairPrefs ? t.pairNext : t.nextMove}</p>
            <button className="display" style={{...s.tonightName, fontSize:34}} onClick={()=>{ setFocusDate(tonight.item); setScreen("date"); }}>{tonight.item.name[lang]}</button>
            <p style={s.lead}>{dateReason(tonight.item, activePrefs, lang)}</p>
            <p style={s.muted}>{pairPrefs ? t.pairNote : t.nextWhy}</p>
            <p style={s.muted}>{t.stageUsed}: {stage==="crush"?t.stageCrush:stage==="long"?t.stageLong:t.stageNew}</p>

            <div style={{margin:"14px 0 8px"}}>
              <p style={s.muted}>{t.filterTime}</p>
              <div style={s.mosaic}>
                {[["any",t.timeAny],["1h",t.time1h],["half",t.timeHalf],["day",t.timeDay]].map(([id,lab])=>(
                  <button key={id} onClick={()=>setFilterTime(id)} style={{...s.chip, borderColor: filterTime===id?temp.accent:"#3A242C", color: filterTime===id?temp.accent:"#F3E6D8"}}>{lab}</button>
                ))}
              </div>
              <p style={s.muted}>{t.filterBudget} / {t.filterPlace}</p>
              <div style={s.mosaic}>
                {[["any",t.budgetAny],["low",t.budgetLow],["mid",t.budgetMid]].map(([id,lab])=>(
                  <button key={"b"+id} onClick={()=>setFilterBudget(id)} style={{...s.chip, borderColor: filterBudget===id?temp.accent:"#3A242C", color: filterBudget===id?temp.accent:"#F3E6D8"}}>{lab}</button>
                ))}
                {[["any",t.placeAny],["in",t.placeIn],["out",t.placeOut]].map(([id,lab])=>(
                  <button key={"p"+id} onClick={()=>setFilterPlace(id)} style={{...s.chip, borderColor: filterPlace===id?temp.accent:"#3A242C", color: filterPlace===id?temp.accent:"#F3E6D8"}}>{lab}</button>
                ))}
              </div>
            </div>

            {current && (
              <p className="display" style={{fontSize:20, margin:"8px 0 18px"}}>
                <span style={{color:temp.accent, fontWeight:700, marginRight:8}}>{resultType}</span>
                {current.love[lang]}
              </p>
            )}
            {isShortResult && <button style={{...s.ghost, marginBottom:16}} onClick={continueTypeQuiz}>{t.addType}</button>}

            {tonight && (
              <div style={s.tonight}>
                <p className="display" style={{letterSpacing:3, color:"#E8B4BC", fontSize:13, margin:"0 0 8px"}}>{t.tonight}</p>
                <button className="display" style={s.tonightName} onClick={()=>{ setFocusDate(tonight.item); setScreen("date"); }}>{tonight.item.name[lang]}</button>
                <p style={{margin:"8px 0"}}>{dateReason(tonight.item, activePrefs, lang)}</p>
                <p style={s.muted}>{t.tonightWhy}</p>
                <p style={{...s.muted, margin:"10px 0 6px"}}>{t.shopHint}</p>
                <div style={s.storeRow}>
                  <a href={amazonUrl(tonight.item.shop)} target="_blank" rel="noreferrer sponsored" style={s.storeBtn} onClick={()=>track("affiliate_click",{store:"amazon", shop:tonight.item.shop, type:resultType, placement:"tonight"})}>{t.amazon}</a>
                  <a href={rakutenUrl(tonight.item.shop)} target="_blank" rel="noreferrer sponsored" style={s.storeBtn} onClick={()=>track("affiliate_click",{store:"rakuten", shop:tonight.item.shop, type:resultType, placement:"tonight"})}>{t.rakuten}</a>
                </div>
              </div>
            )}

            <div style={s.card}>
              <p className="display" style={s.kicker}>{t.persona}</p>
              <p style={s.muted}>{t.personNote}</p>
              <p>{t.like}: {lh.like.join(" / ") || "—"}</p>
              <p>{t.hate}: {lh.hate.join(" / ") || "—"}</p>
              {resultType && <p style={s.muted}>{t.compat}: {(COMPAT[resultType]||[]).join(" / ")}</p>}
              {current && <p style={s.muted}>{t.caution}: {current.caution[lang]}</p>}
            </div>

            <div style={s.mosaic}>
              {[["fit",t.fitTitle],["avoid",t.avoidTitle],["pair",t.pairTitle]].map(([id,lab])=>(
                <button key={id} onClick={()=>setTab(id)} style={{...s.chip, borderColor: tab===id?temp.accent:"#3A242C", color: tab===id?temp.accent:"#F3E6D8"}}>{lab}</button>
              ))}
            </div>
            {tab==="fit" && top.map((row)=><DateCard key={row.item.id} row={row} compact />)}
            {tab==="avoid" && avoid.map((row)=><DateCard key={row.item.id} row={row} />)}
            {tab==="pair" && (
              <div>
                <div style={s.card}>
                  <p className="display" style={{...s.kicker, color:temp.accent}}>{t.inviteSend}</p>
                  <p style={s.muted}>{t.inviteHint}</p>
                  <p style={{whiteSpace:"pre-wrap", lineHeight:1.7}}>{inviteBody}</p>
                  <div style={s.storeRow}>
                    <button style={s.primary} onClick={async()=>{
                      const text = inviteBody + "\n" + shareUrl(true);
                      try { await navigator.clipboard.writeText(text); } catch(e){}
                      setInviteMsgOn(true); setTimeout(()=>setInviteMsgOn(false),1600);
                      track("invite_copy", { type: resultType||"short" });
                    }}>{inviteMsgOn?t.copied:t.inviteCopy}</button>
                    <button style={s.ghost} onClick={async()=>{
                      try { await navigator.clipboard.writeText(shareUrl(true)); } catch(e){}
                      setCopyMsg(true); setTimeout(()=>setCopyMsg(false),1600);
                    }}>{copyMsg?t.copied:t.inviteLink}</button>
                    <button style={s.ghost} onClick={()=>{
                      track("share_click",{method:"line", type:resultType||"short"});
                      window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl(true))}`,"_blank");
                    }}>{t.shareLine}</button>
                  </div>
                </div>
                {pairPrefs && tonight && (
                  <div style={s.tonight}>
                    <p className="display" style={{letterSpacing:3, color:"#E8B4BC", fontSize:13}}>{t.pairNext}</p>
                    <p className="display" style={{fontSize:24, margin:"6px 0"}}>{tonight.item.name[lang]}</p>
                    <p style={s.muted}>{dateReason(tonight.item, pairPrefs, lang)}</p>
                  </div>
                )}
                {resultType && (
                  <div style={{marginTop:12}}>
                    <p style={s.muted}>{t.pairPick}</p>
                    <div style={s.mosaic}>
                      {ALL_TYPES.map((code)=>(
                        <button key={code} onClick={()=>setPartner(code)} className="display" style={{...s.chip, color: partner===code?temp.accent:"#B9A59A", borderColor: partner===code?temp.accent:"#3A242C"}}>{code}</button>
                      ))}
                    </div>
                    <p style={s.muted}>{t.pairScore} {pairScore(resultType, partner)}% · {TYPES[partner].love[lang]}</p>
                  </div>
                )}
              </div>
            )}

            <div style={{display:"flex", gap:8, flexWrap:"wrap", marginTop:18}}>
              <button style={s.primary} onClick={saveResult}>{saveMsg?t.saved:t.save}</button>
              <button style={s.primary} onClick={()=>setTab("pair")}>{t.inviteSend}</button>
              <button style={s.ghost} onClick={()=>startQuiz(quizMode==="short"?"short":"full")}>{t.retake}</button>
              {resultType && <button style={s.ghost} onClick={()=>setScreen("type")}>{t.lookType}</button>}
            </div>
            <div style={{marginTop:24}}>
              <p style={s.muted}>{t.share}</p>
              <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                <button style={s.ghost} onClick={()=>{ track("share_click",{method:"x", type:resultType}); window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareMessage)}&url=${encodeURIComponent(shareUrl())}`,"_blank"); }}>{t.shareX}</button>
                <button style={s.ghost} onClick={()=>{ track("share_click",{method:"line", type:resultType}); window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl(true))}`,"_blank"); }}>{t.shareLine}</button>
                <button style={s.ghost} onClick={async()=>{ try{ await navigator.clipboard.writeText(shareUrl(true)); }catch(e){} setCopyMsg(true); setTimeout(()=>setCopyMsg(false),1600); }}>{copyMsg?t.copied:t.shareCopy}</button>
                {current && <button style={s.ghost} onClick={shareImage}>{t.shareImg}</button>}
              </div>
            </div>
          </div>
        )}

        {screen==="type" && resultType && TYPES[resultType] && (
          <div style={{paddingTop:24}}>
            <p className="display" style={s.kicker}>{t.typesTitle}</p>
            <h1 className="display" style={{color:temp.accent, fontSize:48, margin:"0 0 8px"}}>{resultType}</h1>
            <p className="display" style={{fontSize:24}}>{TYPES[resultType].love[lang]}</p>
            <p style={s.lead}>{TYPES[resultType].blurb[lang]}</p>
            <p style={s.muted}>{t.caution}: {TYPES[resultType].caution[lang]}</p>
            <h2 className="display" style={s.h2}>{t.fitTitle}</h2>
            {rankedDates(resultType, emptyPrefs()).slice(0,8).map((row,i)=>(
              <div key={row.item.id} style={s.rank}><span style={{color:temp.accent}}>{i+1}</span> {row.item.name[lang]} <span style={{marginLeft:"auto", color:temp.accent}}>{row.score}%</span></div>
            ))}
            <button style={{...s.primary, marginTop:16}} onClick={()=>setScreen("result")}>{t.lookType}</button>
          </div>
        )}

        {screen==="types" && (
          <div style={{paddingTop:24}}>
            <h1 className="display" style={s.h2}>{t.typesTitle}</h1>
            <div style={s.mosaic}>
              {ALL_TYPES.map((code)=>{
                const c = TEMP[temperamentOf(code)];
                return <button key={code} onClick={()=>{ setResultType(code); setScreen("type"); }} className="display" style={{...s.chip, color:c.accent, borderColor:c.accent+"55"}}>{code}<br/><span style={{fontSize:11, fontWeight:400, color:"#B9A59A"}}>{TYPES[code].love[lang]}</span></button>;
              })}
            </div>
          </div>
        )}

        {screen==="dates" && (
          <div style={{paddingTop:24}}>
            <h1 className="display" style={s.h2}>{t.datesTitle}</h1>
            {DATES.map((d)=>(
              <div key={d.id} style={s.card}>
                <button style={s.dateName} onClick={()=>{ setFocusDate(d); setScreen("date"); }}>{d.name[lang]}</button>
                <p style={s.muted}>{d.why[lang]}</p>
                <div style={s.storeRow}>
                  <span style={s.storeLabel}>{t.stores}</span>
                  <a href={amazonUrl(d.shop)} target="_blank" rel="noreferrer sponsored" style={s.storeBtn} onClick={()=>track("affiliate_click",{store:"amazon", shop:d.shop, placement:"list"})}>{t.amazon}</a>
                  <a href={rakutenUrl(d.shop)} target="_blank" rel="noreferrer sponsored" style={s.storeBtn} onClick={()=>track("affiliate_click",{store:"rakuten", shop:d.shop, placement:"list"})}>{t.rakuten}</a>
                </div>
              </div>
            ))}
          </div>
        )}

        {screen==="date" && focusDate && (
          <div style={{paddingTop:24}}>
            <p className="display" style={s.kicker}>{t.fromDate}</p>
            <h1 className="display" style={s.title}>{focusDate.name[lang]}</h1>
            <p style={s.lead}>{focusDate.why[lang]}</p>
            {resultType && <p>{matchScore(focusDate, resultType, prefs)}% · {dateReason(focusDate, prefs, lang)}</p>}
            <div style={s.card}>
              {PREF_KEYS.map((k)=>(
                <div key={k} style={s.stat}><span>{PREF_LABEL[lang][k]}</span><span>{"●".repeat(focusDate.stats[k]||3)}{"○".repeat(5-(focusDate.stats[k]||3))}</span></div>
              ))}
            </div>
            <h2 className="display" style={s.h2}>{t.typesTitle}</h2>
            {ALL_TYPES.map((code)=>({code, score:affinity(focusDate, code)})).sort((a,b)=>b.score-a.score).slice(0,8).map((row)=>(
              <button key={row.code} style={s.rank} onClick={()=>{ setResultType(row.code); setScreen("type"); }}>
                <span>{row.code}</span><span style={{marginLeft:"auto"}}>{row.score}%</span>
              </button>
            ))}
            <div style={{...s.storeRow, marginTop:16}}>
              <span style={s.storeLabel}>{t.stores}</span>
              <a href={amazonUrl(focusDate.shop)} target="_blank" rel="noreferrer sponsored" style={s.primary} onClick={()=>track("affiliate_click",{store:"amazon", shop:focusDate.shop, placement:"detail"})}>{t.amazon}</a>
              <a href={rakutenUrl(focusDate.shop)} target="_blank" rel="noreferrer sponsored" style={s.ghost} onClick={()=>track("affiliate_click",{store:"rakuten", shop:focusDate.shop, placement:"detail"})}>{t.rakuten}</a>
            </div>
          </div>
        )}

        {screen==="saved" && (
          <div style={{paddingTop:24}}>
            <h1 className="display" style={s.h2}>{t.navSaved}</h1>
            {history.length===0 ? <p style={s.muted}>{t.noSaved}</p> : history.map((h,i)=>(
              <div key={i} style={s.rank}>
                <b>{h.type}</b> <span style={s.muted}>{h.date}{h.top?` · ${h.top}`:""}</span>
                <button style={s.ghost} onClick={()=>{ setResultType(h.type && h.type!=="PREF" ? h.type : null); if(h.prefs) setPrefs(h.prefs); if(h.stage) setStage(h.stage); setPairPrefs(null); setScreen("result"); }}>{t.load}</button>
                <button style={s.linkBtn} onClick={()=>{ const n=history.filter((_,j)=>j!==i); setHistory(n); try{localStorage.setItem(STORAGE_KEY, JSON.stringify(n));}catch(e){} }}>{t.del}</button>
              </div>
            ))}
          </div>
        )}
      </main>

      {screen!=="quiz" && (
        <footer style={s.footer}>
          <a href={SUPPORT_URL} target="_blank" rel="noreferrer" style={{color:"#C9A06A", textDecoration:"none"}} onClick={()=>track("support_click",{type:resultType})}>☕ {t.support}</a>
          <p style={s.fine}>{t.footer}</p>
          <details style={s.faq}>
            <summary style={s.faqQ}>{CONSENT_TEXT[lang].legalTitle}</summary>
            <p style={s.muted}>{CONSENT_TEXT[lang].legalBody}</p>
          </details>
        </footer>
      )}

      {consent===null && (
        <div role="dialog" aria-live="polite" style={s.consentBar}>
          <p style={{margin:0, fontSize:13, lineHeight:1.6, flex:"1 1 260px"}}>{CONSENT_TEXT[lang].body}</p>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <button style={s.ghost} onClick={()=>answerConsent(false)}>{CONSENT_TEXT[lang].decline}</button>
            <button style={s.primary} onClick={()=>answerConsent(true)}>{CONSENT_TEXT[lang].accept}</button>
          </div>
        </div>
      )}
    </div>
  );
}

const s = {
  app:{minHeight:"100vh", background:"#140C10", color:"#F3E6D8"},
  header:{position:"sticky", top:0, zIndex:10, borderBottom:"1px solid #2A171D", background:"#140C10ee", backdropFilter:"blur(8px)"},
  headerInner:{maxWidth:760, margin:"0 auto", padding:"14px 20px", display:"flex", gap:12, alignItems:"center", flexWrap:"wrap"},
  brand:{display:"flex", alignItems:"center", gap:8, background:"transparent", border:"none", color:"#F3E6D8", cursor:"pointer", padding:0, marginRight:"auto"},
  brandMark:{width:24, height:24, borderRadius:999, background:"#E8B4BC", display:"flex", alignItems:"center", justifyContent:"center"},
  brandName:{fontSize:18, fontWeight:600},
  nav:{display:"flex", gap:4, background:"#24151A", borderRadius:999, padding:4, flexWrap:"wrap"},
  navBtn:{background:"transparent", border:"none", color:"#B9A59A", padding:"7px 10px", borderRadius:999, cursor:"pointer", fontSize:12},
  navOn:{background:"#E8B4BC", color:"#140C10"},
  lang:{background:"#24151A", border:"1px solid", borderRadius:999, padding:"5px 9px", fontSize:11, cursor:"pointer"},
  wrap:{maxWidth:760, margin:"0 auto", padding:"0 20px 40px"},
  hero:{padding:"48px 0 20px"},
  kicker:{letterSpacing:3, color:"#E8B4BC", fontSize:13, margin:"0 0 8px"},
  title:{fontSize:42, lineHeight:1.15, margin:"0 0 14px", fontWeight:600},
  lead:{color:"#C9B4A8", fontSize:16, lineHeight:1.7, maxWidth:520},
  primary:{background:"#E8B4BC", color:"#140C10", border:"none", borderRadius:999, padding:"12px 22px", fontWeight:700, cursor:"pointer"},
  ghost:{background:"transparent", color:"#F3E6D8", border:"1px solid #3A242C", borderRadius:999, padding:"10px 16px", cursor:"pointer"},
  grid3:{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))", gap:12, marginTop:28},
  step:{background:"#24151A", border:"1px solid #3A242C", borderRadius:16, padding:16},
  stepH:{fontSize:20, marginBottom:6},
  h2:{fontSize:26, margin:"28px 0 12px"},
  mosaic:{display:"flex", flexWrap:"wrap", gap:8, margin:"8px 0 16px"},
  chip:{background:"#24151A", border:"1px solid", borderRadius:12, padding:"8px 10px", cursor:"pointer", color:"#F3E6D8", textAlign:"left"},
  bar:{height:4, background:"#2A171D", borderRadius:99, overflow:"hidden", margin:"8px 0 22px"},
  barIn:{height:"100%", background:"#E8B4BC"},
  q:{fontSize:26, lineHeight:1.45, margin:"0 0 18px"},
  opt:{background:"#24151A", border:"1px solid #3A242C", borderRadius:14, padding:16, color:"#F3E6D8", textAlign:"left", cursor:"pointer", fontSize:15},
  linkBtn:{background:"transparent", border:"none", color:"#B9A59A", textDecoration:"underline", marginTop:16, cursor:"pointer"},
  card:{background:"#24151A", border:"1px solid #3A242C", borderRadius:16, padding:16, margin:"10px 0"},
  muted:{color:"#B9A59A", fontSize:14, lineHeight:1.6},
  tonight:{background:"#24151A", border:"1px solid #E8B4BC55", borderRadius:18, padding:18, margin:"8px 0 18px"},
  tonightName:{background:"transparent", border:"none", color:"#F3E6D8", fontSize:28, padding:0, cursor:"pointer", textDecoration:"underline", textUnderlineOffset:4},
  rowBetween:{display:"flex", justifyContent:"space-between", gap:12, alignItems:"baseline"},
  dateName:{background:"transparent", border:"none", color:"#F3E6D8", fontSize:18, fontWeight:700, padding:0, cursor:"pointer", textAlign:"left"},
  storeRow:{display:"flex", flexWrap:"wrap", gap:8, alignItems:"center", marginTop:10},
  storeLabel:{fontSize:12, color:"#8F7A72"},
  storeBtn:{display:"inline-flex", textDecoration:"none", color:"#F3E6D8", border:"1px solid #3A242C", borderRadius:999, padding:"6px 12px", fontSize:12},
  rank:{display:"flex", gap:10, alignItems:"center", width:"100%", padding:"10px 0", borderBottom:"1px solid #2A171D", background:"transparent", color:"#F3E6D8", borderLeft:0, borderRight:0, borderTop:0, cursor:"pointer"},
  stat:{display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:"1px solid #2A171D", fontSize:14, color:"#C9B4A8"},
  footer:{borderTop:"1px solid #2A171D", maxWidth:760, margin:"20px auto 0", padding:"24px 20px 36px"},
  consentBar:{position:"fixed", left:0, right:0, bottom:0, zIndex:20, display:"flex", gap:14, flexWrap:"wrap", alignItems:"center", justifyContent:"space-between", background:"#1D1116ee", backdropFilter:"blur(8px)", borderTop:"1px solid #3A242C", padding:"14px 20px", color:"#F3E6D8"},
  faq:{background:"#24151A", border:"1px solid #3A242C", borderRadius:12, padding:"12px 14px", margin:"8px 0"},
  faqQ:{cursor:"pointer", fontWeight:600, fontSize:15},
  fine:{color:"#8F7A72", fontSize:12, lineHeight:1.6},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
